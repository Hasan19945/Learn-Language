<style>/* Layout: one centred reading column (max 720px), bottom tab bar, lesson path as a vertical trail. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --sunk:#e8eef1; --ink:#15212b; --muted:#566874; --line:#d6e0e5;
  --accent:#1d5d7c; --accent-soft:#dcebf2; --on-accent:#ffffff;
  --en:#1f62a6; --ei:#c2183a; --et:#2c7a54; --ok:#2c7a54; --ok-soft:#dff1e7; --bad:#b4232f; --bad-soft:#f8e1e3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px; --shadow:0 1px 2px rgb(21 33 43/.06), 0 4px 16px rgb(21 33 43/.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16212a; --sunk:#1c2a34; --ink:#e6edf1; --muted:#97a8b3; --line:#283843;
  --accent:#6db2d3; --accent-soft:#1d3645; --on-accent:#0b1720;
  --en:#7ab3ec; --ei:#f2738a; --et:#62c393; --ok:#62c393; --ok-soft:#173527; --bad:#f2737d; --bad-soft:#3a1d22;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --sunk:#1c2a34; --ink:#e6edf1; --muted:#97a8b3; --line:#283843;
  --accent:#6db2d3; --accent-soft:#1d3645; --on-accent:#0b1720;
  --en:#7ab3ec; --ei:#f2738a; --et:#62c393; --ok:#62c393; --ok-soft:#173527; --bad:#f2737d; --bad-soft:#3a1d22;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:650}
h3{font-size:1.05rem;font-weight:650}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.no{font-family:var(--display);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* buttons */
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;background:var(--accent);color:var(--on-accent);transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* header / nav */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand b{color:var(--ei)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--muted);font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}

/* progress bars */
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:56px;height:56px}
.ring circle{fill:none;stroke-width:6}
.ring .t{stroke:var(--sunk)} .ring .v{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font:700 13px var(--body)}

/* onboarding */
.dots{display:flex;gap:6px}
.dots i{height:6px;flex:1;border-radius:9px;background:var(--sunk)}
.dots i.on{background:var(--accent)}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s, background .15s}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice small{color:var(--muted)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.hero-flag{display:flex;gap:6px;align-items:end;height:46px}
.hero-flag span{width:12px;border-radius:3px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}

/* path */
.path{display:flex;flex-direction:column;position:relative}
.path::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;width:3px;background:var(--line);border-radius:3px}
.node{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 0;text-align:left;border:0;background:none;position:relative}
.node .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);z-index:1}
.node .ic svg{width:30px;height:30px}
.node.open .ic{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.node.done .ic{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.node.locked{cursor:not-allowed} .node.locked .ic,.node.locked .txt{opacity:.5}
.node .txt{display:flex;flex-direction:column;min-width:0}
.chip{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.go{background:var(--accent);color:var(--on-accent)}

/* lesson */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.steps button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
.note p{margin-top:6px}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tip{border-left:4px solid var(--ei);background:var(--surface);border-radius:4px var(--r) var(--r) 4px;padding:14px 16px}
.tip .eyebrow{color:var(--ei)}
.words{display:flex;flex-direction:column}
.word{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .main{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.word .no{font-size:1.15rem}
.say{color:var(--muted);font-size:.9rem}
.ex{grid-column:1/-1;font-size:.93rem;color:var(--muted)}
.ex b{color:var(--ink);font-weight:600}
.forms{grid-column:1/-1;font-size:.88rem;color:var(--muted)}
.g{font:700 .72rem var(--body);padding:2px 7px;border-radius:6px;color:var(--on-accent);text-transform:lowercase}
.g.en{background:var(--en)} .g.ei{background:var(--ei)} .g.et{background:var(--et)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--accent-soft);color:var(--accent)}
.line.B .who{background:var(--sunk);color:var(--ei)}
.line p.tr{font-size:.9rem;color:var(--muted)}

/* flashcard */
.card-wrap{perspective:1200px}
.flash{position:relative;width:100%;min-height:260px;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--display);font-size:2rem;font-weight:650;line-height:1.15;text-wrap:balance}
.face .hint{position:absolute;bottom:12px;font-size:.8rem;color:var(--muted)}

/* quiz */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:1.02rem;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r);padding:14px 16px;animation:pop .25s ease both}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.score{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.confirm{background:var(--bad-soft);border-radius:var(--r);padding:14px}
.btn.danger{background:var(--bad);color:#fff}

.fade{animation:fade .3s ease both}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
@keyframes rise{from{transform:scaleY(.2);transform-origin:bottom}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-weight:700}
button.chip{border:0}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lvl[aria-expanded="true"]{border-color:var(--accent)}
.lvl .txt{display:flex;flex-direction:column;min-width:0}
.lvl-id{font-family:var(--display);font-weight:700;font-size:1.05rem;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.lvl-id.sm{width:36px;height:36px;font-size:.9rem;border-radius:9px}
.grp{border-top:1px solid var(--line);padding-top:10px}
.grp summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:4px 0}
.grp summary::-webkit-details-marker{display:none}
.grp[open] summary{margin-bottom:10px}
/* idiom picture cards */
.pic{width:84px;aspect-ratio:1;max-width:100%;border-radius:20px;display:grid;place-items:center;flex:none;font-size:2.6rem;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;background:radial-gradient(circle at 30% 25%,var(--surface),var(--accent-soft) 70%);border:1px solid var(--line);overflow:hidden;white-space:nowrap}
.pic span{display:block;letter-spacing:-.04em}
.pic.big{width:120px;font-size:3.6rem;margin:0 auto}
.word.idiom{grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.idiom-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.idiom-body .no{font-size:1.15rem}
.lit{font-style:italic;color:var(--muted);font-size:.92rem}
.flash{min-height:320px}
@media (max-width:420px){.pic{width:64px;font-size:2rem;border-radius:16px}.pic.big{width:104px;font-size:3.1rem}}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:1rem}
.tok:disabled{cursor:default}
.tok.used{visibility:hidden}
.built{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.built.right,.input.right{border:1.5px solid var(--ok);background:var(--ok-soft)}
.built.wrong,.input.wrong{border:1.5px solid var(--bad);background:var(--bad-soft)}
</style>

<script>// A0 curriculum for Turkish speakers. Bokmål. Every quiz item has a correct answer index (a) and explanation (e).
// Word: {no, tr, say (Turkish-letter pronunciation guide), ex:[no,tr], g (en|ei|et), def, pl, note}
const W = (no, tr, say, exNo, exTr, x = {}) => ({ no, tr, say, ex: [exNo, exTr], ...x });
const N = (g, no, def, pl, tr, say, exNo, exTr) => W(no, tr, say, exNo, exTr, { g, def, pl });
// Idiom: lit = word-for-word Turkish, pic = emoji scene that shows the literal image (memory hook).
const I = (no, tr, lit, pic, exNo, exTr) => W(no, tr, "", exNo, exTr, { lit, pic });

const NO_LESSONS = [
{
  id: "l1", title: "Selamlaşma", no: "Hilsener", icon: "chat",
  intro: "Norveççe seslerle ve günlük selamlaşmalarla başlıyoruz. Bu ifadeleri Norveç'te her gün duyacaksın.",
  notes: [
    { h: "Norveç alfabesi", p: "Norveç alfabesinde 29 harf vardır. Türkçede olmayan üç harf: æ, ø, å. Bazı harfler Türkçeden farklı okunur. Aşağıdaki karşılıklar yaklaşıktır; en iyi öğrenme yolu dinlemektir.",
      table: [["Harf", "Yaklaşık ses", "Örnek"], ["æ", "geniş e (\"ev\" kelimesindeki e)", "lærer"], ["ø", "ö", "brød [brö]"], ["å", "o", "nå [no]"], ["y", "ü", "Tyrkia [türkia]"], ["u", "ü ile u arası", "du [dü]"], ["j", "y", "ja [ya]"], ["o", "çoğu zaman u", "god [gu], bor [bur]"]] },
    { h: "Yazıldığı gibi okunmayan harfler", p: "hv- ile başlayan kelimelerde h okunmaz: hva [va], hvordan [vurdan]. Kelime sonundaki -d çoğu zaman okunmaz: god [gu], kveld [kvel]. Doğu Norveç'te rs, \"ş\" gibi okunur: norsk [noşk]." },
    { h: "Günlük kullanım", p: "\"Hei\" her ortamda kullanılır: iş yerinde, okulda, dükkânda. Ayrılırken \"Ha det\" ya da \"Ha det bra\" denir. Norveççede \"lütfen\" anlamına gelen tek bir kelime yoktur; çoğu zaman \"takk\" kullanılır: \"Ja, takk.\" (Evet, lütfen / teşekkürler)." }
  ],
  tip: "Türkçede h harfi her zaman okunur. Norveççede hv- ile başlayan soru kelimelerinde (hva, hvor, hvordan) h sessizdir.",
  words: [
    W("hei", "merhaba", "hey", "Hei, Ayşe!", "Merhaba Ayşe!"),
    W("god morgen", "günaydın", "gu morn", "God morgen! Hvordan har du det?", "Günaydın! Nasılsın?"),
    W("god kveld", "iyi akşamlar", "gu kvel", "God kveld, Mehmet!", "İyi akşamlar Mehmet!"),
    W("ha det", "hoşça kal, görüşürüz", "ha de", "Ha det bra!", "Hoşça kal!"),
    W("takk", "teşekkürler", "tak", "Ja, takk.", "Evet, teşekkürler."),
    W("bra", "iyi", "bra", "Bra, takk.", "İyiyim, teşekkürler."),
    W("unnskyld", "affedersiniz, pardon", "ünşül", "Unnskyld!", "Pardon!"),
    W("ja", "evet", "ya", "Ja, takk.", "Evet, teşekkürler."),
    W("nei", "hayır", "ney", "Nei, takk.", "Hayır, teşekkürler."),
    W("og", "ve", "o", "Bra, takk. Og du?", "İyiyim, teşekkürler. Ya sen?"),
    W("Hvordan har du det?", "Nasılsın?", "vurdan har dü de", "Hei! Hvordan har du det?", "Merhaba! Nasılsın?")
  ],
  dialogue: [["A", "God morgen!", "Günaydın!"], ["B", "God morgen! Hvordan har du det?", "Günaydın! Nasılsın?"], ["A", "Bra, takk. Og du?", "İyiyim, teşekkürler. Ya sen?"], ["B", "Bra, takk.", "İyiyim, teşekkürler."], ["A", "Ha det!", "Görüşürüz!"], ["B", "Ha det bra!", "Hoşça kal!"]],
  quiz: [
    { q: "\"hvordan\" kelimesi nasıl okunur?", o: ["[vurdan] – h okunmaz", "[hvordan] – h ve v okunur", "[hordan] – v okunmaz"], a: 0, e: "hv- ile başlayan kelimelerde h okunmaz. Ayrıca o harfi burada u gibi okunur: [vurdan]." },
    { q: "\"Hvordan har du det?\" sorusuna uygun cevap hangisi?", o: ["Bra, takk.", "Ha det!", "God kveld!", "Nei."], a: 0, e: "\"Nasılsın?\" sorusuna \"Bra, takk.\" (İyiyim, teşekkürler.) diye cevap verilir." },
    { q: "Akşam biriyle karşılaştın. Ne dersin?", o: ["God kveld!", "God morgen!", "Ha det!"], a: 0, e: "\"God kveld\" = iyi akşamlar. \"God morgen\" sabah kullanılır, \"Ha det\" ise ayrılırken." },
    { q: "\"god\" kelimesinin telaffuzu hangisine en yakın?", o: ["[gu]", "[god]", "[got]"], a: 0, e: "Sondaki d okunmaz ve o burada u gibi okunur: god morgen [gu morn]." }
  ],
  review: ["hv- başında h okunmaz: hva [va].", "Sondaki -d çoğu zaman okunmaz: god [gu], kveld [kvel].", "\"Takk\" hem teşekkür hem de kibar bir \"lütfen\" yerine kullanılır."]
},
{
  id: "l2", title: "Ben, sen, o", no: "Pronomen og «er»", icon: "people",
  intro: "Kişi zamirlerini ve en önemli fiil olan \"er\" (olmak) fiilini öğreniyoruz. Bununla ilk tam cümlelerini kuracaksın.",
  notes: [
    { h: "Kişi zamirleri", p: "Türkçedeki \"o\" Norveççede ikiye ayrılır: erkek için han, kadın için hun.",
      table: [["Norveççe", "Türkçe", "Okunuş"], ["jeg", "ben", "yay"], ["du", "sen", "dü"], ["han", "o (erkek)", "han"], ["hun", "o (kadın)", "hün"], ["vi", "biz", "vi"], ["dere", "siz (çoğul)", "dere"], ["de", "onlar", "di"]] },
    { h: "\"er\" her kişide aynıdır", p: "Türkçede ek kişiye göre değişir: öğrenciyim, öğrencisin, öğrenci. Norveççede \"er\" hiç değişmez: jeg er, du er, han er, vi er, de er." },
    { h: "Meslekten önce artikel yok", p: "Meslek söylerken \"en\" kullanılmaz: Jeg er student. Han er lærer." },

  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("adim-norsk:" + t));

const sayBtn = t => voice ? `<button class="icon-btn" data-act="speak" data-t="${esc(t)}" aria-label="Dinle: ${esc(t)}">${icon("sound")}</button>` : "";
const tts = w => w.tts || w.no;

// ---------- content helpers ----------
const interestWords = () => (S.profile?.interests || []).flatMap(k => INTERESTS[k].words);
const lessonWords = L => L.pack === "words" ? [...L.words, ...interestWords()] : L.words;
const allWords = () => [...LESSONS.flatMap(L => L.words), ...Object.values(INTERESTS).flatMap(P => P.words)];
const forms = w => w.g ? `<span class="g ${w.g}">${w.g}</span>` : "";
const upTo = id => LESSONS.slice(0, LESSONS.findIndex(L => L.id === id) + 1).flatMap(L => L.words);
const dueWords = () => allWords().filter(w => S.srs[w.id]?.due <= today()).sort((a, b) => S.srs[a.id].due.localeCompare(S.srs[b.id].due));

// ---------- components ----------
// Idiom picture: an emoji scene of the literal meaning. Size shrinks with the number of pictures.
const picCount = t => { try { return [...new Intl.Segmenter().segment(t)].length; } catch { return Math.ceil([...t].length / 2); } };
const picTile = (w, cls = "") => `<div class="pic ${cls}" role="img" aria-label="${esc(w.lit)}"><span style="font-size:${[0, 1, .74, .56, .46][Math.min(picCount(w.pic), 4)]}em">${w.pic}</span></div>`;
function idiomRow(w) {
  return `<div class="word idiom">${picTile(w)}<div class="idiom-body"><span class="no">${esc(w.no)}</span>
  <p class="lit">Kelimesi kelimesine: “${esc(w.lit)}”</p><p>Anlamı: <b>${esc(w.tr)}</b></p>
  <p class="ex"><b>${esc(w.ex[0])}</b> — ${esc(w.ex[1])}</p></div>${sayBtn(tts(w))}</div>`;
}
function wordRow(w) {
  if (w.pic) return idiomRow(w);
  return `<div class="word"><div class="main">${forms(w)}<span class="no">${esc(w.no)}</span>${w.say ? `<span class="say">[${esc(w.say)}]</span>` : ""}<span>— ${esc(w.tr)}</span></div>${sayBtn(tts(w))}
  ${w.g ? `<div class="forms">${w.g} ${esc(w.no)} · belirli: <b>${esc(w.def)}</b>${w.pl ? ` · çoğul: <b>${esc(w.pl)}</b>` : ""}</div>` : w.note ? `<div class="forms">${esc(w.note)}</div>` : ""}
  <div class="ex"><b>${esc(w.ex[0])}</b> — ${esc(w.ex[1])}</div></div>`;
}
const table = t => `<div class="tbl"><table><thead><tr>${t[0].map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.slice(1).map(r => `<tr>${r.map((c, i) => `<td class="${i ? "" : "no"}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function ring(v, max) {
  const r = 24, c = 2 * Math.PI * r, p = Math.min(v / max, 1);
  return `<svg class="ring" viewBox="0 0 56 56" role="img" aria-label="Bugün ${v}/${max}"><circle class="t" cx="28" cy="28" r="${r}"/><circle class="v" cx="28" cy="28" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle">${Math.round(p * 100)}%</text></svg>`;
}
const bar = p => `<div class="bar" role="progressbar" aria-valuenow="${Math.round(p * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p * 100}%"></i></div>`;
function nav() {
  const t = [["path", "path", "Öğrenme yolu"], ["progress", "chart", "İlerleme"], ["settings", "gear", "Ayarlar"]];
  return `<nav class="nav"><div>${t.map(([v, i, l]) => `<button data-act="go" data-v="${v}" ${V.view === v ? 'aria-current="page"' : ""}>${icon(i)}${l}</button>`).join("")}</div></nav>`;
}

document.addEventListener("submit", async e => {

// ---------- onboarding ----------
function onboard() {
  const d = V.draft, steps = 4, s = V.ob;
  const choice = (key, val, t, sub, multi) => {
    const on = multi ? d[key].includes(val) : d[key] === val;
    return `<button class="choice" data-act="${multi ? "toggle" : "set"}" data-k="${key}" data-val="${val}" aria-pressed="${on}"><strong>${t}</strong>${sub ? `<small>${sub}</small>` : ""}</button>`;
  };
  let body = "", ok = true;
  if (s === 0) {
    body = `<div class="hero-flag" aria-hidden="true">${[30, 46, 22, 38, 46, 30].map((h, i) => `<span style="height:${h}px;background:var(--${["en", "ei", "accent", "et", "en", "ei"][i]});animation-delay:${i * 60}ms"></span>`).join("")}</div>
      <h1>${esc(C.hero)}</h1>
      <p class="muted">Kısa dersler, Türkçe açıklamalar ve günlük hayatta işine yarayacak cümleler. Önce birkaç soru soracağız.</p>
      <h2>Ana dilin hangisi?</h2>
      <div class="choices">${choice("lang", "tr", "Türkçe", esc(C.sub))}</div>
      <p class="muted" style="font-size:.9rem">${esc(C.about)}</p>`;
  } else if (s === 1) {
    body = `<h2>${esc(C.yourLang)} ne durumda?</h2><div class="choices">${LEVELS.map(l => choice("level", l.v, l.t, l.d)).join("")}</div>
      <p class="muted" style="font-size:.9rem">Biraz biliyorsan kurulumdan sonra kısa bir seviye testine girersin ve sana uygun seviye gösterilir. Bir sonraki derse geçmek için ders testini en az %${PASS * 100} ile geçmen gerekir.</p>`;
    ok = !!d.level;
  } else if (s === 2) {
    body = `<h2>Günlük hedefin?</h2><p class="muted">Bir alıştırma = bir kart ya da bir test sorusu. Hedefi sonra değiştirebilirsin.</p><div class="choices">${GOALS.map(g => choice("goal", g.v, g.t, g.d)).join("")}</div>`;
    ok = !!d.goal;
  } else {
    body = `<h2>Nelerle ilgileniyorsun?</h2><p class="muted">Seçtiğin alanlardan ek kelimeler ve örnek cümleler derslere eklenir. Ana müfredat herkes için aynıdır. İstediğin kadar seç ya da hiçbirini seçme.</p>
      <div class="choices two">${Object.entries(INTERESTS).map(([k, P]) => choice("interests", k, P.label, P.words.slice(0, 3).map(w => w.no).join(", "), true)).join("")}</div>`;
  }
  return `<main class="wrap fade"><div class="dots" aria-label="Adım ${s + 1} / ${steps}">${Array.from({ length: steps }, (_, i) => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</div>
    ${body}<div class="row">${s ? `<button class="btn ghost" data-act="obBack">Geri</button>` : ""}<button class="btn" style="flex:1" data-act="obNext" ${ok ? "" : "disabled"}>${s === steps - 1 ? "Öğrenmeye başla" : "Devam"}</button></div></main>`;
}

// ---------- path ----------
function path() {
  const g = S.profile.goal, done = S.days[today()] || 0, st = streak();
  return `<main class="wrap fade"><header class="top"><span class="brand">Adım Adım <b>${esc(C.name)}</b></span><span class="row" style="gap:6px"><button class="chip acc" data-act="go" data-v="course" aria-label="Dili değiştir">${esc(C.lang)}</button><span class="chip">${LEVEL_INFO[currentLevel()].id}</span><button class="chip acc" data-act="go" data-v="settings" aria-label="Hesap ayarları">${esc(accName(ACC))}</button></span></header>
  <section class="panel goal">${ring(done, g)}<div><h3>Bugünkü hedef: ${Math.min(done, g)} / ${g}</h3><p class="muted">${done >= g ? "Hedef tamam. Bravo!" : `${g - done} alıştırma kaldı.`}${st ? ` · ${st} gün üst üste hedef` : ""}</p></div></section>
  ${reviewCard()}
  ${placementCard()}
  <section class="stack">${LEVEL_INFO.map((info, li) => levelBlock(info, li)).join("")}
  ${V.lockMsg ? `<p class="panel muted fade">${V.lockMsg}</p>` : ""}
  ${LESSONS.every(L => LS(L.id).done) ? `<div class="panel"><h3>Tebrikler, bütün seviyelerdeki (A0–${LEVEL_INFO.at(-1).id}) dersleri tamamladın!</h3><p class="muted">Kartlarla ve testlerle tekrar yapmaya devam edebilirsin.</p></div>` : ""}
  </section></main>${nav()}`;
}

function levelBlock(info, li) {
  const items = LESSONS.map((L, i) => [L, i]).filter(([L]) => L.level === info.id);
  const doneN = items.filter(([L]) => LS(L.id).done).length, anyOpen = items.some(([, i]) => unlocked(i));
  if (V.openLv == null) V.openLv = currentLevel();
  const isOpen = V.openLv === li;
  const head = `<button class="lvl" data-act="lvToggle" data-i="${li}" aria-expanded="${isOpen}"><span class="lvl-id">${info.id}</span><span class="txt"><strong>${esc(info.title)}</strong><span class="muted" style="font-size:.85rem">${esc(info.d)}</span></span><span class="chip ${doneN === items.length ? "ok" : ""}">${anyOpen ? `${doneN} / ${items.length}` : `${icon("lock").replace('class=""', 'style="width:12px;height:12px;vertical-align:-1px"')} Kilitli`}</span></button>`;
  if (!isOpen) return head;
  return head + `<div class="path">${items.map(([L, i]) => {
    const s = LS(L.id), open = unlocked(i), cls = s.done ? "done" : open ? "open" : "locked";
    const chip = s.done ? `<span class="chip ok">%${Math.round(s.best * 100)}</span>` : open ? `<span class="chip go">${s.attempts || s.seen ? "Devam" : "Başla"}</span>` : `<span class="chip">Kilitli</span>`;
    return `<button class="node ${cls}" data-act="${open ? "open" : "locked"}" data-i="${i}" ${open ? "" : 'aria-disabled="true"'}><span class="ic">${icon(s.done ? "check" : L.icon)}</span><span class="txt"><span class="eyebrow">${L.level} · Ders ${posInLevel(i)} · ${esc(L.no)}</span><strong>${esc(L.title)}</strong><span class="muted" style="font-size:.88rem">${L.words.length} kelime ve ifade</span></span>${chip}</button>`;
  }).join("")}</div>`;
}
function placementCard() {
  const last = (S.placements || []).at(-1);
  return `<section class="panel row" style="justify-content:space-between"><div style="flex:1;min-width:200px"><p class="eyebrow">Seviye testi</p><p>${last ? `Son sonucun: <b>${LEVEL_INFO[last.rec].id}</b> (${esc(last.date)}). İstediğin zaman tekrar ölçebilirsin.` : "Seviyeni bilmiyor musun? Kısa bir testle sana uygun seviyeyi bul."}</p></div><button class="btn" data-act="go" data-v="placement">${last ? "Yeniden ölç" : "Seviyemi ölç"}</button></section>`;
}

function reviewCard() {
  const n = dueWords().length, dues = Object.values(S.srs).map(x => x.due).sort();
  if (!n && !dues.length) return "";
  const next = dues.length && new Date(dues[0] + "T00:00").toLocaleDateString("tr", { day: "numeric", month: "long" });
  return `<section class="panel row" style="justify-content:space-between"><div style="flex:1;min-width:200px"><p class="eyebrow">Günlük tekrar</p><p>${n ? `<b>${n}</b> kelimenin tekrar zamanı geldi. Unutmadan önce tekrar etmek, kelimeyi kalıcı hale getirir.` : `Bugün tekrar edilecek kelime yok. Sıradaki tekrar: ${esc(next)}.`}</p></div>${n ? `<button class="btn" data-act="rvStart">Tekrar et</button>` : ""}</section>`;
}

// ---------- placement test ----------
function newPtLevel(lv) { return pick(PLACEMENT[LEVEL_INFO[lv].id], PT_PER).map(shuffleQ); }
function placement() {
  const t = V.pt;
  const header = `<header class="top"><button class="icon-btn" data-act="go" data-v="path" aria-label="Öğrenme yoluna dön">${icon("back")}</button><div style="flex:1;min-width:0"><p class="eyebrow">Seviye testi</p><h2>${t ? `Bölüm: ${LEVEL_INFO[t.lv].id} · ${esc(LEVEL_INFO[t.lv].title)}` : "Seviyeni ölç"}</h2></div></header>`;
  if (!t) {
    const hist = (S.placements || []).slice(-3).reverse();
    return `<main class="wrap fade">${header}
    <p>Test A0'dan başlar. Her seviyeden ${PT_PER} soru gelir. En az ${PT_PASS} doğru yaparsan bir sonraki seviyenin sorularına geçersin. Geçemediğin ilk seviyede test biter ve sana uygun seviye gösterilir.</p>
    <div class="stack" style="gap:8px">${LEVEL_INFO.map(l => `<div class="row" style="flex-wrap:nowrap"><span class="lvl-id sm">${l.id}</span><span class="muted">${esc(l.d)}</span></div>`).join("")}</div>
    <p class="muted" style="font-size:.9rem">Yaklaşık 5–10 dakika sürer. Bilmediğin soruda tahmin etmek yerine "Bilmiyorum" de; sonuç daha doğru çıkar. Test sonucu dersleri tamamlanmış saymaz; sadece uygun seviyedeki dersleri açar.</p>
    ${hist.length ? `<section class="panel stack"><h3>Önceki sonuçların</h3>${hist.map(h => `<div class="row" style="justify-content:space-between"><span>${esc(h.date)}</span><span class="chip">${LEVEL_INFO[h.rec].id}</span></div>`).join("")}</section>` : ""}
    <button class="btn block" data-act="ptStart">Teste başla</button></main>`;
  }
  if (t.done) return `<main class="wrap fade">${header.replace(/<h2>.*<\/h2>/, "<h2>Sonuç</h2>")}${ptResult(t)}</main>`;
  const q = t.qs[t.pos], ans = t.picked !== null, right = ans && t.picked === q.a;
  const answered = t.scores.length * PT_PER + t.pos;
  return `<main class="wrap fade">${header}
  <div class="row" style="justify-content:space-between"><span class="muted">Soru ${t.pos + 1} / ${PT_PER} · bu bölümde doğru: ${t.correct}</span><span class="muted">Toplam ${answered} soru</span></div>${bar(t.pos / PT_PER)}
  <section class="stack fade" aria-live="polite"><h2>${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o, i) => `<button class="opt ${ans && i === q.a ? "right" : ans && i === t.picked ? "wrong" : ""}" data-act="ptAnswer" data-i="${i}" ${ans ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
    ${ans ? `<div class="fb ${right ? "ok" : "bad"}"><h3>${right ? "Doğru!" : t.picked < 0 ? `Cevap: ${esc(q.o[q.a])}` : `Doğru cevap: ${esc(q.o[q.a])}`}</h3><p>${esc(q.e)}</p></div><button class="btn block" data-act="ptNext">Devam</button>`
      : `<button class="btn ghost block" data-act="ptAnswer" data-i="-1">Bilmiyorum</button>`}
  </section></main>`;
}
function ptResult(t) {
  const rec = t.rec, info = LEVEL_INFO[rec], allPassed = t.scores.length === LEVEL_INFO.length && t.scores.every(x => x.correct >= PT_PASS);
  const why = allPassed ? `Bütün bölümleri geçtin. ${LEVEL_INFO.at(-1).id} derslerini açıp ileri düzey konularla devam edebilirsin.`
    : rec === 0 ? "A0 bölümünde biraz daha pratik gerekiyor. A0 dersleriyle başlamak sana en çok faydayı sağlar."
    : `${LEVEL_INFO[rec - 1].id} bölümünü geçtin, ${info.id} bölümünde ${t.scores.at(-1).correct} / ${PT_PER} doğru yaptın. ${info.id} seviyesi sana uygun.`;
  const can = rec > startLv();
  return `<section class="panel stack fade" style="text-align:center"><p class="eyebrow">Sana uygun seviye</p><p class="score">${info.id}</p><h3>${esc(info.title)}</h3><p class="muted">${esc(info.d)}</p><p>${why}</p></section>
  <section class="panel stack"><h3>Bölüm sonuçları</h3>${t.scores.map(x => `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><strong>${LEVEL_INFO[x.lv].id}</strong><span class="chip ${x.correct >= PT_PASS ? "ok" : ""}">${x.correct} / ${PT_PER} · ${x.correct >= PT_PASS ? "geçti" : "geçmedi"}</span></div>${bar(x.correct / PT_PER)}</div>`).join("")}</section>
  <div class="stack">${can ? `<button class="btn block" data-act="ptApply">${info.id} seviyesinden başla</button><p class="muted" style="font-size:.88rem">Bu, ${info.id} seviyesine kadar olan dersleri açar. Önceki dersleri istediğin zaman tekrar edebilirsin. Hiçbir ders tamamlanmış sayılmaz.</p>`
    : `<p class="muted" style="font-size:.9rem">${info.id} seviyesi ve öncesindeki dersler zaten açık.</p><button class="btn block" data-act="ptApply">Öğrenme yoluna dön</button>`}
  <button class="btn ghost block" data-act="ptStart">Testi yeniden çöz</button></div>`;
}

// ---------- lesson ----------
function lesson() {
  const L = LESSONS[V.lesson], s = LS(L.id), skip = S.profile.level === "a0plus";
  const can = { learn: true, cards: s.seen || skip, quiz: s.cards || skip };
  const tabs = [["learn", "1 · Öğren"], ["cards", "2 · Kartlar"], ["quiz", "3 · Test"]];
  const body = { learn: learnStep, cards: cardsStep, quiz: quizStep }[V.step](L, s);
  return `<main class="wrap fade"><header class="top"><button class="icon-btn" data-act="go" data-v="path" aria-label="Öğrenme yoluna dön">${icon("back")}</button><div style="flex:1;min-width:0"><p class="eyebrow">${L.level} · Ders ${posInLevel(V.lesson)} · ${esc(L.no)}</p><h2>${esc(L.title)}</h2></div></header>
  <div class="steps" role="tablist">${tabs.map(([k, t]) => `<button data-act="step" data-s="${k}" ${V.step === k ? 'aria-current="step"' : ""} ${can[k] ? "" : "disabled"}>${t}</button>`).join("")}</div>${body}</main>`;
}
function learnStep(L) {
  const ints = S.profile.interests || [];
  const extra = L.pack === "words" && ints.length ? `<section class="panel stack"><p class="eyebrow">İlgi alanların</p><h3>Ek kelimeler</h3><div class="words">${interestWords().map(wordRow).join("")}</div></section>`
    : L.pack === "sentences" && ints.length ? `<section class="panel stack"><p class="eyebrow">İlgi alanların</p><h3>Örnek cümleler</h3><div class="dlg">${ints.flatMap(k => INTERESTS[k].sentences.map(([no, tr]) => `<div class="line"><span class="who" title="${esc(INTERESTS[k].label)}">${esc(INTERESTS[k].label[0])}</span><div><p class="no">${esc(no)}</p><p class="tr">${esc(tr)}</p></div>${sayBtn(no)}</div>`)).join("")}</div><p class="muted" style="font-size:.88rem">${esc(C.sentenceNote)}</p></section>` : "";
  return `<p>${esc(L.intro)}</p>
  ${L.notes.map(n => `<section class="panel note"><h3>${esc(n.h)}</h3><p>${esc(n.p)}</p>${n.table ? table(n.table) : ""}</section>`).join("")}

// ---------- flashcards ----------
function startCards(L) { V.fc = { deck: shuffle(lessonWords(L)), known: 0, flipped: false, dir: V.fc?.dir || "no", total: lessonWords(L).length }; }

// ---------- quiz ----------
const explain = w => `${w.g ? w.g + " " : ""}${w.no}${w.lit ? ` (“${w.lit}”)` : ""} = ${w.tr}. Örnek: ${w.ex[0]} — ${w.ex[1]}`;
function vocabQ(w, pool) {
  if (w.pic && Math.random() < 0.5) {
    const opts = shuffle([w, ...pick(pool.filter(x => x.id !== w.id && x.no !== w.no), 3)]);
    return { wid: w.id, pic: w.pic, lit: w.lit, q: "Bu resim hangi deyimi anlatıyor?", o: opts.map(x => x.no), a: opts.indexOf(w), e: `${w.no}: kelimesi kelimesine “${w.lit}”. Anlamı: ${w.tr}.`, speak: null };
  }
  const dir = Math.random() < 0.5 ? "no" : "tr";
  const others = pick(pool.filter(x => x.id !== w.id && x.tr !== w.tr && x.no !== w.no), 3);
  const key = dir === "no" ? "tr" : "no";
  const opts = shuffle([w, ...others]);
  return { wid: w.id, q: dir === "no" ? `“${w.no}” ne demek?` : `“${w.tr}” ${C.lang} nasıl söylenir?`, o: opts.map(x => x[key]), a: opts.indexOf(w), e: explain(w), speak: dir === "no" ? tts(w) : null };
}
const norm = s => s.toLowerCase().normalize("NFC").replace(/[’‘]/g, "'").replace(/[.,!?;:«»"“”¿¡]/g, "").replace(/\s+/g, " ").trim();
const typable = w => !w.pic && !/\.\.\.|…|\/|\(/.test(w.no) && w.no.split(" ").length <= 4;
function typeQ(w, pool) {
  const ok = [w, ...pool.filter(x => x !== w && norm(x.tr) === norm(w.tr))].flatMap(x => [x.no, x.g && x.g + " " + x.no]).filter(Boolean).map(norm);
  return { type: "type", wid: w.id, q: `“${w.tr}” ${C.lang} nasıl yazılır?`, ok, show: w.no, a: 0, e: explain(w), speak: null };
}
function dist(a, b) {

}
const sentences = L => [...new Map([...L.dialogue.map(([, no, tr]) => [no, tr]), ...L.words.map(w => w.ex)].map(s => [s[0], s])).values()]

}
function shuffleQ(q) { const idx = shuffle(q.o.map((_, i) => i)); return { ...q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) }; }
const newQuiz = (qs, x = {}) => ({ queue: qs, total: qs.length, pos: 0, first: 0, picked: null, retry: 0, built: [], typed: "", typo: false, ...x });
function buildQuiz(i) {
  const L = LESSONS[i], own = L.words, prev = LESSONS.slice(0, i).flatMap(x => x.words);
  const qs = pick(own, 7).map((w, k) => k < 2 && typable(w) ? typeQ(w, own) : vocabQ(w, own.length >= 4 ? own : [...own, ...prev]));

  qs.push(...L.quiz.map(q => shuffleQ(q)));
  if (prev.length) { // spaced review: prefer words not yet answered correctly
    const fresh = prev.filter(w => !S.learned[w.id]);
    pick(fresh.length >= 2 ? fresh : prev, 2).forEach(w => qs.push({ ...vocabQ(w, prev), review: true }));
  }
  const ints = S.profile.interests || [];
  if (L.pack === "words" && ints.length) { const iw = interestWords(); pick(iw, Math.min(3, iw.length)).forEach(w => qs.push(vocabQ(w, [...iw, ...own]))); }
  if (L.pack === "sentences" && ints.length) {
    const all = Object.values(INTERESTS).flatMap(P => P.sentences);

}

    ${ans ? "" : `${letters.length ? `<div class="row">${letters.map(t => `<button type="button" class="tok" data-act="ins" data-t="${t}" aria-label="${t} harfini ekle">${t}</button>`).join("")}</div>` : ""}
